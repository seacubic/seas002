<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>해양기상정보 알림문 생성기</title>
    <style>
        :root {
            --primary-glow: #00d2ff;
            --secondary-glow: #3a7bd5;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', 'Pretendard', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Animated Background Waves */
        body::before {
            content: "";
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.05) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
            z-index: -1;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius);
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 40px;
            background: linear-gradient(to right, #00d2ff, #9cedff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.05em;
        }

        .input-group, .output-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        textarea {
            width: 100%;
            height: 180px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-main);
            padding: 15px;
            font-size: 1rem;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            flex: 1;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-generate {
            background: linear-gradient(135deg, #3a7bd5, #00d2ff);
            color: white;
            box-shadow: 0 10px 20px -5px rgba(0, 210, 255, 0.4);
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(0, 210, 255, 0.5);
        }

        .btn-clear {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-dim);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-clear:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .output-wrapper {
            position: relative;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
        }

        #output {
            width: 100%;
            height: 250px;
            color: #e2e8f0;
            white-space: pre-wrap;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.95rem;
            overflow-y: auto;
            line-height: 1.8;
        }

        .btn-copy {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 6px 12px;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-copy:hover {
            background: var(--accent);
            color: var(--bg-dark);
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>MARINE WEATHER</h1>
    
    <div class="input-group">
        <label>Input (URL or Raw Text)</label>
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <input type="text" id="urlInput" placeholder="기상청 URL을 입력하세요 (예: kma.go.kr...)" style="flex: 4; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: var(--text-main); padding: 10px; outline: none;">
            <button class="btn-generate" onclick="fetchAndParse()" style="flex: 1; padding: 10px; font-size: 0.8rem; background: var(--secondary-glow);">FETCH DATA</button>
        </div>
        <textarea id="rawInput" placeholder="또는 기상청 원문 데이터를 여기에 직접 붙여넣으세요..."></textarea>
    </div>

    <div class="button-group">
        <button class="btn-generate" onclick="generateAlert()">
            <span id="btnIcon">⚡</span> <span id="btnText">GENERATE ALERT</span>
        </button>
        <button class="btn-clear" onclick="clearInput()">
            CLEAR
        </button>
    </div>

    <div class="output-group">
        <label>Analyzed Categories (Editable)</label>
        <div class="grid-output" id="gridOutput" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px;">
            <!-- Category Cards -->
            <div class="category-card" style="background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 12px; padding: 15px;">
                <h3 style="margin-top: 0; color: var(--accent); font-size: 0.9rem;">1. 기압계 및 날씨</h3>
                <textarea id="cat1" oninput="syncToOutput()" style="width: 100%; height: 100px; background: transparent; border: none; color: var(--text-dim); font-size: 0.85rem; resize: none; outline: none; font-family: inherit; line-height: 1.5;">대기 중...</textarea>
            </div>
            <div class="category-card" style="background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 12px; padding: 15px;">
                <h3 style="margin-top: 0; color: var(--accent); font-size: 0.9rem;">2. 파도 및 바람</h3>
                <textarea id="cat2" oninput="syncToOutput()" style="width: 100%; height: 100px; background: transparent; border: none; color: var(--text-dim); font-size: 0.85rem; resize: none; outline: none; font-family: inherit; line-height: 1.5;">대기 중...</textarea>
            </div>
            <div class="category-card" style="background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 12px; padding: 15px;">
                <h3 style="margin-top: 0; color: var(--accent); font-size: 0.9rem;">3. 안개 및 시정</h3>
                <textarea id="cat3" oninput="syncToOutput()" style="width: 100%; height: 100px; background: transparent; border: none; color: var(--text-dim); font-size: 0.85rem; resize: none; outline: none; font-family: inherit; line-height: 1.5;">대기 중...</textarea>
            </div>
            <div class="category-card" style="background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 12px; padding: 15px;">
                <h3 style="margin-top: 0; color: var(--accent); font-size: 0.9rem;">4. 기온 및 조석</h3>
                <textarea id="cat4" oninput="syncToOutput()" style="width: 100%; height: 100px; background: transparent; border: none; color: var(--text-dim); font-size: 0.85rem; resize: none; outline: none; font-family: inherit; line-height: 1.5;">대기 중...</textarea>
            </div>
        </div>

        <label>Combined Formatted Output (Editable)</label>
        <div class="output-wrapper">
            <textarea id="output" style="width: 100%; height: 250px; background: transparent; border: none; color: #e2e8f0; white-space: pre-wrap; font-family: 'Fira Code', 'Courier New', monospace; font-size: 0.95rem; line-height: 1.8; resize: vertical; outline: none; box-sizing: border-box;">시스템 준비됨. 데이터를 입력하거나 URL을 통해 불러오세요.</textarea>
            <button class="btn-copy" onclick="copyToClipboard()">COPY ALL</button>
        </div>
    </div>

    <footer>
        SECURE MARINE WEATHER PROTOCOL v2.1
    </footer>
</div>

<script>
    async function fetchAndParse() {
        const url = document.getElementById('urlInput').value;
        const rawInput = document.getElementById('rawInput');
        
        if (!url) {
            alert('URL을 입력해주세요.');
            return;
        }

        rawInput.placeholder = "데이터를 불러오는 중...";
        rawInput.value = "";

        try {
            // 참고: 브라우저 보안(CORS) 정책으로 인해 실제 운영 시에는 프록시 서버가 필요할 수 있습니다.
            // 여기서는 시연을 위해 간단한 fetch 구조를 제안합니다.
            const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
            if (!response.ok) throw new Error('Network response was not ok');
            
            const data = await response.json();
            const parser = new DOMParser();
            const doc = parser.parseFromString(data.contents, 'text/html');
            
            // 기상청 페이지 등에서 주요 텍스트 추출 (사이트 구조에 따라 조정 필요)
            const textContent = doc.body.innerText || doc.body.textContent;
            rawInput.value = textContent.trim().substring(0, 5000); // 너무 길 경우 자름
            rawInput.placeholder = "데이터를 성공적으로 불러왔습니다.";
            
            alert('URL 데이터를 성공적으로 불러왔습니다. 이제 GENERATE ALERT 버튼을 눌러주세요.');
        } catch (error) {
            console.error('Fetch error:', error);
            alert('URL 데이터를 가져오는데 실패했습니다. (CORS 제한 또는 잘못된 URL)');
            rawInput.placeholder = "직접 붙여넣기를 이용해주세요.";
        }
    }

    function generateAlert() {
        const input = document.getElementById('rawInput').value;
        const outputElement = document.getElementById('output');
        const btnIcon = document.getElementById('btnIcon');
        const btnText = document.getElementById('btnText');

        if (!input.trim()) {
            alert('데이터를 입력하거나 FETCH 기능을 사용해주세요.');
            return;
        }

        // 로딩 상태 표시
        btnIcon.textContent = "⏳";
        btnText.textContent = "PROCESSING...";

        setTimeout(() => {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const week = ['일', '월', '화', '수', '목', '금', '토'][now.getDay()];
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            const timestamp = `${year}. ${month}. ${day}. (${week}) ${hours}:${minutes}`;

            let formattedText = `[해상기상정보 알림문 - ${timestamp}]\n\n`;

            // 고도화된 카테고리별 파싱 로직 (원문 내용 최대한 보존)
            const extract = (patterns, fallback = "") => {
                for (const pattern of patterns) {
                    const match = input.match(pattern);
                    if (match && match[1]) return match[1].trim();
                }
                return fallback;
            };

            // 데이터 추출
            const data = {
                pressure: extract([
                    /(?:현황|기압|요약)\s*[:\s]([\s\S]*?)(?=○|날씨|전망|$)/,
                    /○\s*([\s\S]*?기압[\s\S]*?)(?=날씨|파고|$)/
                ]),
                weather: extract([/(?:날씨|기상)\s*[:\s]([\s\S]*?)(?=○|파고|바람|$)/, /날씨\s*([\s\S]*?)(?=파고|바람|$)/]),
                waves: extract([/(?:파고|물결|파도)\s*[:\s]([\s\S]*?)(?=○|바람|안개|$)/, /파도\s*([\s\S]*?)(?=바람|안개|$)/]),
                wind: extract([/(?:바람|풍속|풍향)\s*[:\s]([\s\S]*?)(?=○|안개|시정|$)/, /바람\s*([\s\S]*?)(?=안개|시정|$)/]),
                fog: extract([/(?:안개|해무)\s*[:\s]([\s\S]*?)(?=○|시정|기온|$)/, /안개\s*([\s\S]*?)(?=시정|기온|$)/]),
                visibility: extract([/(?:시정|가시거리)\s*[:\s]([\s\S]*?)(?=○|안개|기온|$)/, /시정\s*([\s\S]*?)(?=안개|기온|$)/]),
                temp: extract([/(?:기온|온도)\s*[:\s]([\s\S]*?)(?=○|조석|비고|$)/, /기온\s*([\s\S]*?)(?=조석|비고|$)/]),
                tides: extract([/(?:조석|물때|만조|간조)\s*[:\s]([\s\S]*?)(?=○|기온|비고|$)/, /조석\s*([\s\S]*?)(?=기온|비고|$)/])
            };

            // 1. 개황 및 날씨
            let cat1Text = "";
            if (data.pressure) {
                const sentences = data.pressure.split(/[.!?\n]/);
                const pressureSentences = sentences.filter(s => s.includes('기압')).map(s => s.trim()).filter(s => s.length > 0);
                if (pressureSentences.length > 0) {
                    cat1Text += `개황: ${pressureSentences.join('. ')}.\n`;
                }
            }
            if (data.weather) cat1Text += `날씨: ${data.weather}\n`;
            document.getElementById('cat1').value = cat1Text.trim() || "해당 정보 없음";

            // 2. 파도 및 바람
            let cat2Text = "";
            if (data.waves) cat2Text += `파도: ${data.waves}\n`;
            if (data.wind) cat2Text += `바람: ${data.wind}\n`;
            document.getElementById('cat2').value = cat2Text.trim() || "해당 정보 없음";

            // 3. 안개 및 시정
            let cat3Text = "";
            if (data.fog) cat3Text += `안개: ${data.fog}\n`;
            if (data.visibility) cat3Text += `시정: ${data.visibility}\n`;
            document.getElementById('cat3').value = cat3Text.trim() || "해당 정보 없음";

            // 4. 기온 및 조석
            let cat4Text = "";
            if (data.temp) cat4Text += `기온: ${data.temp}\n`;
            if (data.tides) cat4Text += `조석: ${data.tides}\n`;
            document.getElementById('cat4').value = cat4Text.trim() || "해당 정보 없음";

            syncToOutput(); // 초기 생성 시 전체 텍스트 동기화
            
            btnIcon.textContent = "⚡";
            btnText.textContent = "GENERATE ALERT";
            document.getElementById('output').parentElement.scrollIntoView({ behavior: 'smooth' });
        }, 800);
    }

    // 각 카테고리 수정 시 전체 결과 업데이트
    function syncToOutput() {
        const now = new Date();
        const timestamp = `${now.getFullYear()}. ${String(now.getMonth() + 1).padStart(2, '0')}. ${String(now.getDate()).padStart(2, '0')}. (${['일', '월', '화', '수', '목', '금', '토'][now.getDay()]}) ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        let combined = `[해상기상정보 알림문 - ${timestamp}]\n\n`;
        combined += `○ 개황 및 날씨\n- ${document.getElementById('cat1').value}\n\n`;
        combined += `○ 파도 및 바람\n- ${document.getElementById('cat2').value}\n\n`;
        combined += `○ 안개 및 시정\n- ${document.getElementById('cat3').value}\n\n`;
        combined += `○ 기온 및 조석\n- ${document.getElementById('cat4').value}\n\n`;
        
        // 해역별 정보는 원문에서 다시 파싱하거나 유지 (여기서는 기존 데이터 유지 로직 생략 가능 시 직접 수정 가능)
        combined += `* 본 정보는 시스템에 의해 생성되었으며 사용자가 수동으로 수정할 수 있습니다.`;

        document.getElementById('output').value = combined;
    }

    function clearInput() {
        document.getElementById('rawInput').value = '';
        document.getElementById('cat1').value = '대기 중...';
        document.getElementById('cat2').value = '대기 중...';
        document.getElementById('cat3').value = '대기 중...';
        document.getElementById('cat4').value = '대기 중...';
        document.getElementById('output').value = '시스템 준비됨. 데이터를 입력하거나 URL을 통해 불러오세요.';
    }

    function copyToClipboard() {
        const outputText = document.getElementById('output').value;
        navigator.clipboard.writeText(outputText).then(() => {
            alert('클립보드에 복사되었습니다.');
        }).catch(err => {
            console.error('복사 실패:', err);
        });
    }
</script>

</body>
</html>
