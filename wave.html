<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>해양기상정보 알림문 생성기</title>
    <style>
        :root {
            --primary-glow: #00d2ff;
            --secondary-glow: #3a7bd5;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', 'Pretendard', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Animated Background Waves */
        body::before {
            content: "";
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.05) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
            z-index: -1;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius);
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 40px;
            background: linear-gradient(to right, #00d2ff, #9cedff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.05em;
        }

        .input-group, .output-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        textarea {
            width: 100%;
            height: 180px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-main);
            padding: 15px;
            font-size: 1rem;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            flex: 1;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-generate {
            background: linear-gradient(135deg, #3a7bd5, #00d2ff);
            color: white;
            box-shadow: 0 10px 20px -5px rgba(0, 210, 255, 0.4);
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(0, 210, 255, 0.5);
        }

        .btn-clear {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-dim);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-clear:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* Time Selector Styles */
        .time-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .active-time {
            background: linear-gradient(135deg, #3a7bd5, #00d2ff);
            color: white;
        }

        .output-wrapper {
            position: relative;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
        }

        #output {
            width: 100%;
            height: 250px;
            color: #e2e8f0;
            white-space: pre-wrap;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.95rem;
            overflow-y: auto;
            line-height: 1.8;
        }

        .btn-copy {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 6px 12px;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-copy:hover {
            background: var(--accent);
            color: var(--bg-dark);
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>MARINE WEATHER</h1>
    
    <div class="input-group">
        <label>Input (URL or Raw Text)</label>
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <input type="text" id="urlInput" placeholder="기상청 URL을 입력하세요 (예: kma.go.kr...)" style="flex: 4; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: var(--text-main); padding: 10px; outline: none;">
            <button class="btn-generate" onclick="fetchAndParse()" style="flex: 1; padding: 10px; font-size: 0.8rem; background: var(--secondary-glow);">FETCH DATA</button>
        </div>
        <textarea id="rawInput" placeholder="또는 기상청 원문 데이터를 여기에 직접 붙여넣으세요..."></textarea>
    </div>

    <!-- Time Selector -->
    <div class="time-selector" style="display:flex; gap:10px; margin-bottom:20px;">
        <button id="btnDawn" onclick="setAlertType('새벽')" class="time-btn active-time">
            새벽 알림문
        </button>
        <button id="btnLunch" onclick="setAlertType('점심')" class="time-btn">
            점심 알림문
        </button>
        <button id="btnEvening" onclick="setAlertType('오후')" class="time-btn">
            오후 알림문
        </button>
    </div>

    <div class="button-group">
        <button class="btn-generate" onclick="generateAlert()">
            <span id="btnIcon">⚡</span> <span id="btnText">GENERATE ALERT</span>
        </button>
        <button class="btn-clear" onclick="clearInput()">
            CLEAR
        </button>
    </div>

    <div class="output-group">
        <label>Analyzed Categories (Editable)</label>
        <div class="grid-output" id="gridOutput" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px;">
            <!-- Category Cards -->
            <div class="category-card" style="background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 12px; padding: 15px;">
                <h3 style="margin-top: 0; color: var(--accent); font-size: 0.9rem;">1. 개황 및 날씨</h3>
                <textarea id="cat1" oninput="syncToOutput()" style="width: 100%; height: 100px; background: transparent; border: none; color: var(--text-dim); font-size: 0.85rem; resize: none; outline: none; font-family: inherit; line-height: 1.5;">대기 중...</textarea>
            </div>
            <div class="category-card" style="background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 12px; padding: 15px;">
                <h3 style="margin-top: 0; color: var(--accent); font-size: 0.9rem;">2. 파고 및 바람</h3>
                <textarea id="cat2" oninput="syncToOutput()" style="width: 100%; height: 100px; background: transparent; border: none; color: var(--text-dim); font-size: 0.85rem; resize: none; outline: none; font-family: inherit; line-height: 1.5;">대기 중...</textarea>
            </div>
            <div class="category-card" style="background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 12px; padding: 15px;">
                <h3 style="margin-top: 0; color: var(--accent); font-size: 0.9rem;">3. 안개 및 시정</h3>
                <textarea id="cat3" oninput="syncToOutput()" style="width: 100%; height: 100px; background: transparent; border: none; color: var(--text-dim); font-size: 0.85rem; resize: none; outline: none; font-family: inherit; line-height: 1.5;">대기 중...</textarea>
            </div>
            <div class="category-card" style="background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 12px; padding: 15px;">
                <h3 style="margin-top: 0; color: var(--accent); font-size: 0.9rem;">4. 기온 및 조석</h3>
                <textarea id="cat4" oninput="syncToOutput()" style="width: 100%; height: 100px; background: transparent; border: none; color: var(--text-dim); font-size: 0.85rem; resize: none; outline: none; font-family: inherit; line-height: 1.5;">대기 중...</textarea>
            </div>
            <div class="category-card" style="background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(248, 113, 113, 0.2); border-radius: 12px; padding: 15px;">
                <h3 style="margin-top: 0; color: #f87171; font-size: 0.9rem;">5. 특이사항</h3>
                <textarea id="cat5" oninput="syncToOutput()" style="width: 100%; height: 100px; background: transparent; border: none; color: var(--text-dim); font-size: 0.85rem; resize: none; outline: none; font-family: inherit; line-height: 1.5;">대기 중...</textarea>
            </div>
        </div>

        <label>Combined Formatted Output (Editable)</label>
        <div class="output-wrapper">
            <textarea id="output" style="width: 100%; height: 350px; background: transparent; border: none; color: #e2e8f0; white-space: pre-wrap; font-family: 'Fira Code', 'Courier New', monospace; font-size: 0.95rem; line-height: 1.8; resize: vertical; outline: none; box-sizing: border-box;">시스템 준비됨. 데이터를 입력하거나 URL을 통해 불러오세요.</textarea>
            <button class="btn-copy" onclick="copyToClipboard()">COPY ALL</button>
        </div>
    </div>

    <footer>
        SECURE MARINE WEATHER PROTOCOL v2.3
    </footer>
</div>

<script>

// ==============================
// 알림문 타입
// ==============================

let currentAlertType = "새벽";

// ==============================
// 알림문 타입 선택
// ==============================

function setAlertType(type) {

    currentAlertType = type;

    document
        .querySelectorAll('.time-btn')
        .forEach(btn =>
            btn.classList.remove('active-time')
        );

    if (type === "새벽") {
        document
            .getElementById('btnDawn')
            .classList.add('active-time');
    }

    if (type === "점심") {
        document
            .getElementById('btnLunch')
            .classList.add('active-time');
    }

    if (type === "오후") {
        document
            .getElementById('btnEvening')
            .classList.add('active-time');
    }
}

// ==============================
// 텍스트 정리
// ==============================

function normalizeText(text) {

    return text
        .replace(/\r/g, '')
        .replace(/\t/g, ' ')
        .replace(/[ ]{2,}/g, ' ')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
}

// ==============================
// 섹션 추출
// ==============================

function findSection(text, title) {

    const regex = new RegExp(
        `<${title}>([\\s\\S]*?)(?=<|$)`,
        'i'
    );

    const match = text.match(regex);

    return match ? match[1].trim() : "";
}

// ==============================
// 문장 추출
// ==============================

function extractSentences(text, keywords) {

    if (!text) return "";

    const sentences = text
        .replace(/\n/g, ' ')
        .split(/(?<=[.!?])\s+/)
        .map(v => v.trim())
        .filter(v => v.length > 0);

    const results = [];

    for (const sentence of sentences) {

        const matched = keywords.some(keyword =>
            sentence.includes(keyword)
        );

        if (matched && sentence.length >= 10) {
            results.push(sentence);
        }
    }

    return [...new Set(results)].join('\n');
}

// ==============================
// 불필요 문장 제거
// ==============================

function cleanForecastText(text) {

    return text

        .replace(/\(\d+일\)/g, '')

        .replace(/\* 예상 강수량[\s\S]*?(?=\n\n|$)/g, '')

        .replace(/\* 소나기에 의한 예상 강수량[\s\S]*?(?=\n\n|$)/g, '')

        .replace(/\*/g, '')

        .replace(/[ ]{2,}/g, ' ')

        .trim();
}

// ==============================
// Bullet 제거
// ==============================

function removeBullet(text) {

    return text
        .replace(/○\s*/g, '')
        .replace(/-\s*/g, '')
        .replace(/\*\s*/g, '')
        .trim();
}

// ==============================
// 중복 제거
// ==============================

function uniqueLines(text) {

    const lines = text
        .split('\n')
        .map(v => v.trim())
        .filter(v => v.length > 0);

    return [...new Set(lines)].join('\n');
}

// ==============================
// 시간대별 필터
// ==============================

function filterByAlertType(text) {

    if (!text) return "";

    const sentences = text
        .split('\n')
        .map(v => v.trim())
        .filter(v => v.length > 0);

    // ==========================
    // 새벽 / 점심
    // 오늘 내용만
    // ==========================

    if (
        currentAlertType === "새벽" ||
        currentAlertType === "점심"
    ) {

        return sentences.filter(sentence => {

            return (

                sentence.includes("오늘") ||

                (
                    !sentence.includes("내일") &&
                    !sentence.includes("모레") &&
                    !sentence.includes("글피")
                )
            );

        }).join('\n');
    }

    // ==========================
    // 오후
    // 오늘 오후 + 내일 오전
    // ==========================

    if (currentAlertType === "오후") {

        return sentences.filter(sentence => {

            const todayCondition =

                sentence.includes("오늘") ||

                (
                    !sentence.includes("모레") &&
                    !sentence.includes("글피")
                );

            const tomorrowCondition =

                sentence.includes("내일") &&
                (
                    sentence.includes("오전") ||
                    sentence.includes("아침") ||
                    sentence.includes("새벽") ||
                    sentence.includes("09시") ||
                    sentence.includes("12시")
                );

            return (
                todayCondition ||
                tomorrowCondition
            );

        }).join('\n');
    }

    return text;
}

// ==============================
// 알림문 생성
// ==============================

function generateAlert() {

    const rawInput =
        document.getElementById('rawInput').value;

    const btnIcon = document.getElementById('btnIcon');
    const btnText = document.getElementById('btnText');

    if (!rawInput.trim()) {
        alert('원문을 입력해주세요.');
        return;
    }

    // 로딩 표시
    if (btnIcon) btnIcon.textContent = "⏳";
    if (btnText) btnText.textContent = "PROCESSING...";

    setTimeout(() => {
        const input = normalizeText(rawInput);

        // 섹션 추출
        const rainInfo = findSection(input, "강수 및 유의 사항");
        const tempInfo = findSection(input, "기온 및 하늘상태");
        const cautionInfo = findSection(input, "유의 사항");
        const pressureInfo = findSection(input, "기압계 현황 및 전망");

        // 개황 및 날씨
        const pressureSentences = extractSentences(pressureInfo, ["고기압", "저기압", "기압골", "영향", "이동"]);
        const skySentences = extractSentences(tempInfo, ["구름많", "흐리", "맑"]);
        const rainSentences = extractSentences(rainInfo, ["소나기", "비", "강수"]);

        let weatherText = `${pressureSentences}\n\n${skySentences}\n\n${rainSentences}`;

        // 파고 및 바람
        let waveText = extractSentences(cautionInfo, ["너울", "물결", "풍랑", "해상", "돌풍", "천둥", "번개"]);

        // 안개 및 시정
        let fogText = extractSentences(cautionInfo, ["바다 안개", "안개", "시정", "가시거리"]);

        // 기온 및 조석
        let tempText = extractSentences(tempInfo, ["기온", "최저기온", "최고기온", "평년"]);

        // 특이사항
        let specialText = extractSentences(input, ["우박", "돌풍", "천둥", "번개", "강한 소나기", "너울"]);

        // 정리 및 필터 적용 후 카드 출력
        const process = (t) => filterByAlertType(uniqueLines(cleanForecastText(removeBullet(t))));

        document.getElementById('cat1').value = process(weatherText) || "정보 없음";
        document.getElementById('cat2').value = process(waveText) || "정보 없음";
        document.getElementById('cat3').value = process(fogText) || "정보 없음";
        document.getElementById('cat4').value = process(tempText) || "정보 없음";
        document.getElementById('cat5').value = process(specialText) || "특이사항 없음";

        syncToOutput();

        if (btnIcon) btnIcon.textContent = "⚡";
        if (btnText) btnText.textContent = "GENERATE ALERT";
        document.getElementById('output').parentElement.scrollIntoView({ behavior: 'smooth' });
    }, 400);
}

// ==============================
// 출력 동기화 (실시간 편집 반영)
// ==============================

function syncToOutput() {
    const now = new Date();
    const dateText =
        `${now.getFullYear()}. ` +
        `${String(now.getMonth() + 1).padStart(2, '0')}. ` +
        `${String(now.getDate()).padStart(2, '0')}.` +
        `(${['일','월','화','수','목','금','토'][now.getDay()]})`;

    const weatherVal = document.getElementById('cat1').value;
    const waveVal = document.getElementById('cat2').value;
    const fogVal = document.getElementById('cat3').value;
    const tempVal = document.getElementById('cat4').value;
    const specialVal = document.getElementById('cat5').value;

    let result = `
해양기상정보 알림문 (${currentAlertType})

〈${dateText} 운항상황센터〉

<오늘의 바다 날씨 정보입니다.>

(개황, 날씨)
${weatherVal}

(파고, 바람)
${waveVal}

(안개, 시정)
${fogVal}

(기온, 조석)
${tempVal}
`;

    if (specialVal.trim() && specialVal !== "특이사항 없음" && specialVal !== "정보 없음") {
        result += `

<특이사항>
${specialVal}
`;
    }

    result += `

이상 한국해양교통안전공단 운항상황센터에서 전해드렸습니다.
`;

    document.getElementById('output').value = result.trim();
}

// ==============================
// URL 데이터 가져오기
// ==============================

async function fetchAndParse() {
    const url = document.getElementById('urlInput').value;
    const rawInput = document.getElementById('rawInput');
    
    if (!url) {
        alert('URL을 입력해주세요.');
        return;
    }

    rawInput.placeholder = "데이터를 불러오는 중...";
    rawInput.value = "";

    try {
        const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
        if (!response.ok) throw new Error('Network response was not ok');
        
        const data = await response.json();
        const parser = new DOMParser();
        const doc = parser.parseFromString(data.contents, 'text/html');
        
        const textContent = doc.body.innerText || doc.body.textContent;
        rawInput.value = textContent.trim().substring(0, 5000);
        rawInput.placeholder = "데이터를 성공적으로 불러왔습니다.";
        
        alert('URL 데이터를 성공적으로 불러왔습니다. 이제 GENERATE ALERT 버튼을 눌러주세요.');
    } catch (error) {
        console.error('Fetch error:', error);
        alert('URL 데이터를 가져오는데 실패했습니다. (CORS 제한 또는 잘못된 URL)');
        rawInput.placeholder = "직접 붙여넣기를 이용해주세요.";
    }
}

// ==============================
// 초기화
// ==============================

function clearInput() {
    document.getElementById('rawInput').value = '';
    document.getElementById('cat1').value = '대기 중...';
    document.getElementById('cat2').value = '대기 중...';
    document.getElementById('cat3').value = '대기 중...';
    document.getElementById('cat4').value = '대기 중...';
    document.getElementById('cat5').value = '대기 중...';
    document.getElementById('output').value = '시스템 준비됨. 데이터를 입력하거나 URL을 통해 불러오세요.';
}

// ==============================
// 복사
// ==============================

function copyToClipboard() {
    const output = document.getElementById('output').value;
    navigator.clipboard.writeText(output)
        .then(() => alert('복사되었습니다.'))
        .catch(err => console.error(err));
}

</script>

</body>
</html>
